name: "Infra Preview & Deploy"

on:
  push:
    branches:
      - main
    paths:
      - "10_infra/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-northeast-1
  TERRAFORM_VERSION: 1.14.6
  TF_PROJECT: tastylog
  TF_ENVIRONMENT: dev

defaults:
  run:
    shell: bash
    working-directory: "10_infra/"

jobs:
  preview:
    name: "Preview"
    runs-on: ubuntu-latest
    outputs:
      TF-PLAN-EXIT-CODE: ${{ steps.terraform-plan.outputs.exitcode }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Terraform Format
        run: terraform fmt -check

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_IAM_ROLE_ARN }}

      - name: Terraform Init
        run: terraform init -no-color

      - name: Terraform Validate
        run: terraform validate -no-color

      - name: Terraform Plan
        id: terraform-plan
        continue-on-error: true
        run: |
          terraform plan \
            -var "project=${{ env.TF_PROJECT }}" \
            -var "environment=${{ env.TF_ENVIRONMENT }}" \
            -var "username=${{ secrets.MYSQL_USERNAME }}" \
            -var "password=${{ secrets.MYSQL_PASSWORD }}" \
            -input=false \
            -no-color \
            -detailed-exitcode \

      - name: Slack notify
        if: steps.terraform-plan.outputs.exitcode == 2
        uses: slackapi/slack-github-action@v4.1.0
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            {
              "channel": "C0CLTAF8VLG",
              "blocks": [
                {
                  "type": "card",
                  "title": {
                    "type": "mrkdwn",
                    "text": "承認依頼👻",
                    "verbatim": false
                  },
                  "subtitle": {
                    "type": "mrkdwn",
                    "text": "terraform fmt が変更されました。承認をお願いします。",
                    "verbatim": false
                  },
                  "body": {
                    "type": "mrkdwn",
                    "text": "${{github.server_url}}/${{github.repository}}/actions/runs/${{github.run_id}}",
                    "verbatim": false
                  }
                }
              ]
            }
